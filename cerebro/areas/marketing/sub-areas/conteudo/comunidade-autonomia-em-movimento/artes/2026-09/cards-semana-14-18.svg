<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="5400" viewBox="0 0 1080 5400">
  <defs>
    <style>
      .bg{fill:#f6f2e9}.ink{fill:#263d36}.muted{fill:#6b756b}.line{stroke:#c4b58d;stroke-width:2}.border{fill:#fffdf9;stroke:#c4b58d;stroke-width:3}.tag{font:700 31px Georgia,serif;letter-spacing:1px}.head{font:700 78px Georgia,serif}.sub{font:400 38px Georgia,serif}.small{font:400 30px Georgia,serif}.pill{fill:#edf2ed}.pilltxt{font:400 31px Georgia,serif}
    </style>
  </defs>
  <rect class="bg" width="1080" height="5400"/>
  <!-- 14/09 -->
  <g transform="translate(0,0)"><circle cx="105" cy="92" r="160" fill="#e6d5b4"/><circle cx="970" cy="900" r="180" fill="#dce7d9"/><rect class="border" x="90" y="90" width="900" height="900" rx="52"/><text class="tag muted" x="125" y="155">COMUNIDADE MEV DRA LÍGIA TOLEDO</text><line class="line" x1="125" y1="182" x2="955" y2="182"/><text class="head ink" text-anchor="middle" x="540" y="420">O menor passo</text><text class="head ink" text-anchor="middle" x="540" y="510">ainda é movimento.</text><text class="sub muted" text-anchor="middle" x="540" y="690">Cinco minutos já contam.</text><text class="small muted" x="125" y="935">MOVIMENTO • 14/09</text></g>
  <!-- 15/09 -->
  <g transform="translate(0,1080)"><rect fill="#174a3d" width="1080" height="1080"/><rect x="90" y="90" width="900" height="900" rx="52" fill="#215545" stroke="#cdbb7a" stroke-width="3"/><text class="tag" fill="#dcc983" x="125" y="155">COMUNIDADE MEV DRA LÍGIA TOLEDO</text><line x1="125" y1="182" x2="955" y2="182" stroke="#cdbb7a" stroke-width="2"/><text class="head" fill="#fffaf0" text-anchor="middle" x="540" y="430">Movimento possível</text><text class="head" fill="#fffaf0" text-anchor="middle" x="540" y="520">também conta.</text><text class="sub" fill="#e2e8df" text-anchor="middle" x="540" y="700">Regularidade antes de perfeição.</text><text class="small" fill="#dcc983" x="125" y="935">ATIVIDADE FÍSICA • 15/09</text></g>
  <!-- 16/09 -->
  <g transform="translate(0,2160)"><rect fill="#edf1f2" width="1080" height="1080"/><rect class="border" x="90" y="90" width="900" height="900" rx="52" stroke="#b6c3c1"/><text class="tag muted" x="125" y="155">COMUNIDADE MEV DRA LÍGIA TOLEDO</text><line x1="125" y1="182" x2="955" y2="182" stroke="#bac7c5" stroke-width="2"/><text class="head ink" text-anchor="middle" x="540" y="360">Caminhe no</text><text class="head ink" text-anchor="middle" x="540" y="450">seu ritmo.</text><rect class="pill" x="160" y="530" width="760" height="86" rx="20"/><text class="pilltxt ink" x="205" y="585">1. Escolha um espaço seguro</text><rect class="pill" x="160" y="650" width="760" height="86" rx="20"/><text class="pilltxt ink" x="205" y="705">2. Diminua um pouco a velocidade</text><rect class="pill" x="160" y="770" width="760" height="86" rx="20"/><text class="pilltxt ink" x="205" y="825">3. Observe respiração e apoio</text><text class="small muted" x="125" y="935">MOVIMENTO • 16/09</text></g>
  <!-- 17/09 -->
  <g transform="translate(0,3240)"><rect fill="#f6f2e9" width="1080" height="1080"/><circle cx="940" cy="100" r="170" fill="#dce7d9"/><circle cx="95" cy="965" r="150" fill="#e6d5b4"/><rect class="border" x="90" y="90" width="900" height="900" rx="52"/><text class="tag muted" x="125" y="155">COMUNIDADE MEV DRA LÍGIA TOLEDO</text><line class="line" x1="125" y1="182" x2="955" y2="182"/><text class="head ink" text-anchor="middle" x="540" y="390">Qual barreira</text><text class="head ink" text-anchor="middle" x="540" y="480">apareceu hoje?</text><text class="sub muted" text-anchor="middle" x="540" y="650">Observar já é um passo.</text><text class="small muted" text-anchor="middle" x="540" y="735">Tempo • Cansaço • Desconforto • Esquecimento</text><text class="small muted" x="125" y="935">MOVIMENTO • 17/09</text></g>
  <!-- 18/09 -->
  <g transform="translate(0,4320)"><rect fill="#174a3d" width="1080" height="1080"/><rect x="90" y="90" width="900" height="900" rx="52" fill="#215545" stroke="#cdbb7a" stroke-width="3"/><text class="tag" fill="#dcc983" x="125" y="155">COMUNIDADE MEV DRA LÍGIA TOLEDO</text><line x1="125" y1="182" x2="955" y2="182" stroke="#cdbb7a" stroke-width="2"/><text class="head" fill="#fffaf0" text-anchor="middle" x="540" y="390">O plano bom</text><text class="head" fill="#fffaf0" text-anchor="middle" x="540" y="480">sobrevive à</text><text class="head" fill="#fffaf0" text-anchor="middle" x="540" y="570">vida real.</text><text class="sub" fill="#e2e8df" text-anchor="middle" x="540" y="720">Flexibilidade com direção.</text><text class="small" fill="#dcc983" x="125" y="935">MOVIMENTO • 18/09</text></g>
</svg>
